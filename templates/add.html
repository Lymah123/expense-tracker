{{define "title"}}Expense Tracker - Add Expense{{end}}

{{define "head"}}
<script src="/static/js/theme.js" defer></script>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: var(--background-color);
    margin: 0;
    padding: 40px 20px;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .container {
    background: var(--card-background);
    color: var(--text-color);
    padding: 2.5rem;
    border-radius: 12px;
    box-shadow: var(--card-shadow);
    width: 400px;
    transition: transform 0.3s ease;
  }

  .container:hover {
    transform: translateY(-5px);
  }

  h1 {
    color: var(--text-primary);
    margin-bottom: 1.5rem;
    font-size: 1.8rem;
    text-align: center;
  }

  .form-group {
    margin-bottom: 1.5rem;
  }

  label {
    display: block;
    margin-bottom: 0.5rem;
    color: var(--label-color);
    font-weight: 500;
    font-size: 0.9rem;
  }

  input[type="text"], select {
    width: 100%;
    padding: 12px;
    border: 2px solid var(--input-border);
    border-radius: 8px;
    font-size: 1rem;
    transition: border-color 0.3s ease;
    box-sizing: border-box;
    background: var(--input-background);
    color: var(--text-color);
  }

  input[type="text"]:focus, select:focus {
    outline: none;
    border-color: var(--primary-color);
    box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
  }

  input[type="submit"] {
    width: 100%;
    background: var(--primary-color);
    color: white; /* This is OK as button text */
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.3s ease;
    margin-top: 1rem;
  }

  input[type="submit"]:hover {
    background: var(--hover-color);
  }

  .back-link {
    display: block;
    text-align: center;
    margin-top: 1.5rem;
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 0.9rem;
    transition: color 0.3s ease;
  }

  .back-link:hover {
    color: var(--text-primary);
  }

  /* Custom dropdown styles */
  .hidden-select {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
  }

  .custom-select {
    position: relative;
    width: 100%;
  }

  .selected-option {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    padding: 12px;
    border: 2px solid var(--input-border);
    border-radius: 8px;
    background: var(--input-background);
    color: var(--text-color);
    cursor: pointer;
    font-size: 1rem;
    transition: border-color 0.3s ease;
    box-sizing: border-box;
  }

  .selected-option:hover {
    border-color: var(--primary-color);
  }

  .selected-option::after {
    content: "▼";
    font-size: 0.8rem;
    transition: transform 0.3s;
  }

  .selected-option.open::after {
    transform: rotate(180deg);
  }

  .options-list {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    list-style: none;
    margin: 0;
    padding: 0;
    border: 2px solid var(--primary-color);
    border-radius: 0 0 8px 8px;
    background: var(--card-background);
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    max-height: 200px;
    overflow-y: auto;
    z-index: 999;
    display: none;
  }

  .options-list.show {
    display: block;
  }

  .option-item {
    padding: 12px;
    cursor: pointer;
    color: var(--text-color);
    transition: background-color 0.2s ease;
  }

  .option-item:hover {
    background-color: var(--primary-color);
    color: white;
  }
</style>
{{end}}

{{define "body"}}
<nav class="main-nav">
  <div class="nav-container">
    <a href="/" class="nav-logo">Expense Tracker</a>
    <div class="nav-links">
      <a href="/home">Home</a>
      <a href="/add">Add Expense</a>
      <a href="/dashboard">Dashboard</a>
      <a href="/view">View Expenses</a>
      <a href="/report">Reports</a>
      <a href="/receipts">Receipts</a>
    </div>
  </div>
</nav>
<button id="theme-toggle" class="theme-toggle" onclick="toggleTheme()">🌙 Dark Mode</button>
<div class="container">
  <h1>Add Expense</h1>
  <form method="post" action="/add">
    <div class="form-group">
      <label>Amount</label>
      <input type="text" name="amount" placeholder="Enter amount" required>
    </div>
    <div class="form-group">
      <label>Category</label>
      <input type="text" name="category" placeholder="Enter category" required>
    </div>
    <div class="form-group">
      <label>Description</label>
      <input type="text" name="description" placeholder="Enter description" required>
    </div>
    <div class="form-group">
      <label>Date</label>
      <input type="text" name="date" placeholder="YYYY-MM-DD" required>
    </div>
    <div class="form-group">
      <label>Currency</label>
      <select name="currency" id="currency-select" required>
        {{range .Data}}
        <option value="{{.Code}}">{{.Code}} - {{.Symbol}}</option>
        {{end}}
      </select>
    </div>
    <input type="submit" value="Add Expense">
  </form>
  <a href="/" class="back-link">← Back to Dashboard</a>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Get the currency select element
    const originalSelect = document.getElementById('currency-select');
    if (!originalSelect) return;

    // Create custom dropdown elements
    const customSelect = document.createElement('div');
    customSelect.className = 'custom-select';

    const selectedOption = document.createElement('div');
    selectedOption.className = 'selected-option';
    selectedOption.textContent = originalSelect.options[originalSelect.selectedIndex]?.textContent || 'Select currency';

    const optionsList = document.createElement('ul');
    optionsList.className = 'options-list';

    // Hide the original select
    originalSelect.classList.add('hidden-select');

    // Add the options to our custom dropdown
    Array.from(originalSelect.options).forEach(option => {
      const optionItem = document.createElement('li');
      optionItem.className = 'option-item';
      optionItem.textContent = option.textContent;
      optionItem.dataset.value = option.value;

      // Handle option selection
      optionItem.addEventListener('click', function() {
        selectedOption.textContent = this.textContent;
        originalSelect.value = this.dataset.value;
        optionsList.classList.remove('show');
        selectedOption.classList.remove('open');
      });

      optionsList.appendChild(optionItem);
    });

    // Toggle dropdown visibility
    selectedOption.addEventListener('click', function(e) {
      e.stopPropagation();
      optionsList.classList.toggle('show');
      this.classList.toggle('open');
    });

    // Close dropdown when clicking outside
    document.addEventListener('click', function() {
      optionsList.classList.remove('show');
      selectedOption.classList.remove('open');
    });

    // Add elements to the DOM
    customSelect.appendChild(selectedOption);
    customSelect.appendChild(optionsList);
    originalSelect.parentNode.insertBefore(customSelect, originalSelect.nextSibling);
  });
</script>
{{end}}

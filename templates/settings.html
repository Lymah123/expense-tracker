{{define "content"}}
<div class="container mt-4">
    <h1>Settings</h1>
    {{if .Data.Message}}
    <div class="alert alert-success">{{.Data.Message}}</div>
    {{end}}

    <div class="card">
        <div class="card-body">
            <h5 class="card-title">Application Settings</h5>
            <form action="/settings/update" method="post">
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="email_notifications" name="email_notifications" {{if .Data.Settings.EmailNotifications}}checked{{end}}>
                    <label class="form-check-label" for="email_notifications">Email Notifications</label>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="dark_mode" name="dark_mode" {{if .Data.Settings.DarkMode}}checked{{end}}>
                    <label class="form-check-label" for="dark_mode">Dark Mode</label>
                </div>
                <div class="mb-3">
                    <label for="language" class="form-label">Language</label>
                    <select class="form-select" id="language" name="language">
                        <option value="en" {{if eq .Data.Settings.Language "en"}}selected{{end}}>English</option>
                        <option value="es" {{if eq .Data.Settings.Language "es"}}selected{{end}}>Spanish</option>
                        <option value="fr" {{if eq .Data.Settings.Language "fr"}}selected{{end}}>French</option>
                        <option value="de" {{if eq .Data.Settings.Language "de"}}selected{{end}}>German</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Save Settings</button>
            </form>
        </div>
    </div>
</div>
{{end}}
